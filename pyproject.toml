[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loginlens"
version = "0.1.0"
description = "Find brute-force and password-spraying attacks in Linux SSH login logs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Brandon Nguyen" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["loginlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
